<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8bb;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0c"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#1a1a22" stroke-width="2"/>

  <!-- Claw mark - three diagonal slashes -->
  <g filter="url(#glow)">
    <!-- Left claw -->
    <path d="M140 120 L200 380 L220 380 L175 120 Z" fill="url(#glowGrad)"/>
    <!-- Center claw -->
    <path d="M230 100 L270 400 L290 400 L265 100 Z" fill="url(#glowGrad)"/>
    <!-- Right claw -->
    <path d="M320 120 L360 380 L340 380 L315 120 Z" fill="url(#glowGrad)"/>
  </g>

  <!-- Subtle circuit lines -->
  <g stroke="#00e5ff" stroke-width="1" fill="none" opacity="0.3">
    <line x1="80" y1="256" x2="120" y2="256"/>
    <line x1="392" y1="256" x2="432" y2="256"/>
    <circle cx="80" cy="256" r="4" fill="#00e5ff"/>
    <circle cx="432" cy="256" r="4" fill="#00e5ff"/>
  </g>
</svg>
