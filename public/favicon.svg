    <line x1="102" y1="53" x2="106" y2="53" stroke="#0a0a0c" strokeWidth="1"/>
    <line x1="102" y1="57" x2="106" y2="57" stroke="#0a0a0c" strokeWidth="1"/>
  </g>
  <!-- Antenna -->
  <path d="M42 20 Q32 8 30 14" stroke="#00e5ff" strokeWidth="3" strokeLinecap="round"/>
  <path d="M78 20 Q88 8 90 14" stroke="#00e5ff" strokeWidth="3" strokeLinecap="round"/>
  <circle cx="30" cy="14" r="3" fill="#00e5ff"/>
  <circle cx="90" cy="14" r="3" fill="#00e5ff"/>
