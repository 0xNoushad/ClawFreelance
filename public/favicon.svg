      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00a8bb"/>
    </linearGradient>
    <linearGradient id="claw-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
